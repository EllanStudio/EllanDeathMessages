# EllanDeathMessages
# This plugin replaces the vanilla PlayerDeathEvent message with Adventure Components.
# CraftEngine item_name/custom_name components are preserved and resolved by the client.

enabled: true
prefix: '<#78828F>[<#D98E8E>☠<#78828F>] <#FFFFFF>'

settings:
  # Broadcast a death on all backend servers through Redis.
  cross-server: true
  # -1 broadcasts globally. A positive value limits broadcasts to that block radius.
  # Cross-server broadcast is automatically disabled while a positive range is used.
  broadcast-range: -1
  # The victim still sees their own message when anti-spam suppresses the broadcast.
  send-victim-own-message: true
  send-to-console: true
  # If a category has no messages, leave the original vanilla message untouched.
  fallback-to-vanilla: true
  anti-spam:
    enabled: true
    seconds: 30
    count: 3
  disabled-worlds: []
  # Players in these worlds do not receive death broadcasts.
  muted-worlds: []
  # Deaths of these players are never announced.
  ignored-players: []

redis:
  enabled: true
  host: 127.0.0.1
  port: 6379
  password: ''
  database: 0
  channel: 'ellan:death-messages'

# Available placeholders:
# <player> - player who died
# <killer> - player or living entity that caused the death
# <mob> - living entity that caused the death
# <item> - weapon or item that caused the death
# <direct> - direct projectile or damage entity
# <world> - world name
# <cause> - damage type translation component
messages:
  player_general:
    - '<#8FD3C7><player> <#C7CBD1>被 <killer> <#C7CBD1>送去打复活赛了'
    - '<#8FD3C7><player> <#C7CBD1>与 <killer> <#C7CBD1>进行了激烈交流，然后掉线了'
    - '<#8FD3C7><player> <#C7CBD1>触发了 <killer> <#C7CBD1>的隐藏连招'
